name: 기능 제안 (Feature request)
description: 추가되었으면 하는 기능을 알려 주세요.
labels: [enhancement]
body:
  - type: textarea
    id: why
    attributes:
      label: 해결하려는 문제
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 제안하는 해결 방법
  - type: checkboxes
    id: pr
    attributes:
      label: 직접 구현 의향
      options:
        - label: PR 을 제출하겠습니다(CONTRIBUTING.md 를 읽었습니다)
