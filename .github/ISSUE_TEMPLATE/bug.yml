name: 버그 신고 (Bug report)
description: 잘못 동작하는 부분을 알려 주세요. 보안 문제는 Security 탭으로 제보해 주세요.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 문제 내용
      description: 예상한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. /admin 에서 …
        2. … 를 누른다
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 화면 하단 또는 `docker compose images` 에 표시되는 버전
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 설치 방식
      options:
        - install.sh
        - compose.yaml 로 수동 설치
        - 소스로 빌드
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그
      description: "`docker compose logs app --tail 100` — 비밀값 · 개인 정보는 삭제하고 붙여 넣어 주세요"
      render: text
