# 앱과 DB 만으로 띄우는 최소 구성(MYH-173).
#
# 가장 쉬운 길은 install.sh 다(묻고 답하며 .env 를 만들고 띄운다). 손으로 할 때:
#
#   .env 에 두 줄을 적는다
#     POSTGRES_PASSWORD=아무-긴-글자
#     SESSION_SECRET=$(openssl rand -base64 32 의 결과)
#   docker compose up -d           # 공개 이미지(GHCR)를 받아 띄운다
#   docker compose up -d --build   # 이 저장소의 소스로 빌드해 띄운다
#   docker compose logs app  # 「처음 설정 코드」 를 찾는다
#   → http://localhost:3000/admin 에서 관리자 비밀번호를 정한다
#
# 텔레그램 알림 · 방문 통계(umami) · 감시(Grafana) · Search Console · 비밀글은
# 값을 넣지 않으면 조용히 꺼진다. 도메인 · HTTPS 를 붙이는 것은 README 를 본다.
#
# 프로젝트 이름을 myhome-local 로 따로 둔다. 같은 서버의 다른 compose
# 프로젝트(예: 이름이 myhome 인 것)와 겹치면 그쪽 컨테이너를 덮어쓴다.
name: myhome-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: myhome
      POSTGRES_USER: myhome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없습니다 - 아무 긴 글자나 정해 넣으세요}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myhome -d myhome']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 앱과 같은 이미지로 마이그레이션을 한 번 돌리고 끝난다. 성공해야 앱이 뜬다.
  # 이미지는 ghcr.io/leechis7/myhome-public. 판을 고정하려면 MYHOME_VERSION=1.0.0
  migrate:
    image: ${MYHOME_IMAGE:-ghcr.io/leechis7/myhome-public:${MYHOME_VERSION:-latest}}
    build: .
    command: ['node', 'scripts/migrate.mjs']
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/myhome
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    image: ${MYHOME_IMAGE:-ghcr.io/leechis7/myhome-public:${MYHOME_VERSION:-latest}}
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://myhome:${POSTGRES_PASSWORD}@postgres:5432/myhome
      # 쿠키를 암호화하는 열쇠. 32자 이상. openssl rand -base64 32
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 이 .env 에 없습니다 - openssl rand -base64 32 로 만들어 넣으세요}
      # 바깥에서 들어오는 주소. 캐노니컬 · 사이트맵 · 공유 카드가 쓴다
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # 선택. 비우면 처음 /admin 에서 정한다(로그의 설치 코드를 넣는다)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 선택. 비우면 비밀글이 잠기고 메뉴에서 빠진다
      SECRETS_KEY: ${SECRETS_KEY:-}
      # 선택. 비우면 꺼진다
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # 선택. off 면 이 서버에서는 텔레그램 메모 · 할 일을 받지 않는다
      TELEGRAM_INBOX: ${TELEGRAM_INBOX:-}
      # 선택. 책 찾기를 카카오로 한다. 비우면 Open Library
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      # 선택. 고른 책의 소개를 Gemini 로 요약한다. 비우면 앞부분을 줄인다
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      MONITORING_DASHBOARD: ${MONITORING_DASHBOARD:-}
      UPLOAD_DIR: /app/storage/uploads
      SECRET_UPLOAD_DIR: /app/storage/secrets
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # 올린 그림 · 첨부 · 비밀글 파일. 컨테이너를 다시 만들어도 남는다
      - uploads:/app/storage/uploads
      - secrets:/app/storage/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db:
  uploads:
  secrets:
